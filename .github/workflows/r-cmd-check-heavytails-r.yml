name: R CMD check - heavytailsR
on:
  pull_request:
    paths:
      - 'r-package/**'
      - '.github/workflows/r-cmd-check-heavytails-r.yml'
  push:
    branches: [main]
    paths:
      - 'r-package/**'
      - '.github/workflows/r-cmd-check-heavytails-r.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r-package
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package
          check_args: 'c("--as-cran", "--no-manual")'
