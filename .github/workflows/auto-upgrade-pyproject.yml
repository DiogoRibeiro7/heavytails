name: Auto upgrade pyproject constraints

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-upgrade-pyproject
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run updater (caret, no majors, no pre-releases)
        run: >-
          poetry run python scripts/pyproject_updater.py
          --strategy caret
          --groups main,dev
          --respect-major
          --no-prerelease

      # CI verifies that poetry.lock matches pyproject.toml, so a constraint
      # bump that leaves the lock file behind would open an unmergeable PR.
      - name: Refresh the lock file
        run: poetry lock

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- pyproject.toml poetry.lock; then
            echo "No constraint changes; nothing to do."
            exit 0
          fi

          BRANCH="chore/upgrade-pyproject-constraints"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pyproject.toml poetry.lock
          git commit -m "chore: upgrade dependency constraints in pyproject"
          git push --force --set-upstream origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Pull request already open; the force push updated it."
          else
            gh pr create \
              --title "chore: upgrade pyproject constraints" \
              --body "Automated update of dependency constraints, with a refreshed \`poetry.lock\`." \
              --base "$BASE_BRANCH" \
              --head "$BRANCH"
          fi
