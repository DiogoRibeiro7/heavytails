name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Monday 04:00 UTC, for the coverage job below. Merges to main measure it
    # too; this is so a quiet week cannot let the number go stale unnoticed.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "2.2.1"

# snok/install-poetry only exports Poetry onto PATH for bash. Under the Windows
# runner's default pwsh shell every `poetry` call fails with "The term 'poetry'
# is not recognized", so pin bash everywhere and keep the steps OS-agnostic.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (ubuntu-latest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Full coverage stays on Ubuntu across every supported interpreter.
        # A separate cross-platform smoke job below keeps Windows and macOS
        # portability visible without repeating the expensive Monte Carlo suite.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: Install project
        run: poetry install --no-interaction --only-root

      - name: Verify the lock file matches pyproject.toml
        run: poetry check --lock

      - name: Validate Zenodo metadata
        run: poetry run python scripts/validate_zenodo_metadata.py

      # No coverage here, and -n auto to use the runner's cores. The suite
      # is 1m36s this way against 6m54s with coverage and 20m37s as this job
      # used to run it -- coverage instrumentation traces Python bytecode, so
      # it costs about 6.4x and is unaffected by the work having moved into
      # NumPy. It is measured in the `coverage` job below instead, on merges
      # to main and weekly, because it is a slowly-changing map of what is
      # untested rather than a per-change signal: the gate sits at 80% against
      # an actual 90%, so no single change can trip it, and the defects found
      # in this library so far have all been in code that was covered.
      - name: Run tests
        run: >-
          poetry run pytest tests/
          -n auto
          --junitxml=pytest.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: pytest.xml

  coverage:
    name: Coverage
    # Not on pull requests. See the test job above for why: it is a
    # slowly-changing map of what is untested, and measuring it on every
    # change across every interpreter cost about five minutes a job to
    # recompute a number that moves by fractions of a point.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --with dev

      - name: Install project
        run: poetry install --no-interaction --only-root

      - name: Measure coverage
        run: >-
          poetry run pytest tests/
          -n auto
          --cov=heavytails
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  cross-platform-smoke:
    name: Smoke (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest numpy

      - name: Import package and check metadata
        run: |
          python - <<'PY'
          import importlib.metadata
          import heavytails

          assert importlib.metadata.version("heavytails")
          assert hasattr(heavytails, "Pareto")
          assert hasattr(heavytails, "threshold_averaged_orthogonalized_hill_estimator")
          PY

      - name: Run portability smoke tests
        run: >-
          python -m pytest
          tests/test_doctests.py
          tests/test_tail_index.py
          tests/test_vectorized.py
          -q

  lint-and-type-check:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run ruff linting
        run: poetry run ruff check --output-format=github .

      - name: Run ruff formatting check
        run: poetry run ruff format --check .

      - name: Run mypy type checking
        run: poetry run mypy heavytails/ scripts/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with dev,docs

      # Findings here are actionable, so let the job fail instead of quietly
      # uploading a report that nobody reads.
      - name: Run bandit security linter
        run: poetry run bandit -c pyproject.toml -r heavytails/ scripts/

      # Audits the resolved environment. heavytails itself is installed as an
      # editable local project and has no releases to check, hence --skip-editable.
      - name: Audit dependencies for known vulnerabilities
        run: poetry run pip-audit --skip-editable

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with docs

      # --strict turns broken links and missing references into failures.
      - name: Build documentation
        run: poetry run mkdocs build --strict

  deploy-docs:
    name: Deploy documentation
    needs: [test, lint-and-type-check, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --with docs

      - name: Deploy to GitHub Pages
        run: poetry run mkdocs gh-deploy --force

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Build package
        run: poetry build

      # Catches malformed metadata before it reaches PyPI, where it is permanent.
      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    # coverage is here because it used to be implicit: the gate lived inside
    # the test job, so nothing could publish without it passing. Now that the
    # measurement has moved off the pull-request path, naming it keeps the
    # guarantee exactly where it matters -- a released artifact -- while pull
    # requests stop paying five minutes a job for it.
    needs: [test, coverage, lint-and-type-check, security, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/heavytails
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
