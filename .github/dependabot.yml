version: 2

# Reviewers are assigned from .github/CODEOWNERS; the `reviewers` key here is
# deprecated and is intentionally omitted.
updates:
  # Python dependencies. Related development and documentation packages remain
  # grouped, while major version upgrades are handled deliberately.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "bandit"
          - "pip-audit"
          - "types-*"
      docs-dependencies:
        patterns:
          - "mkdocs*"
          - "mkdocstrings*"
      example-dependencies:
        patterns:
          - "matplotlib"
          - "seaborn"
          - "pandas"
          - "plotly"
          - "notebook"
          - "numpy"
          - "scipy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
