default_language_version:
  python: python3

# Hook versions are kept in step with the pinned dev dependencies in
# pyproject.toml so that local hooks and CI agree on every check.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses MkDocs' custom !ENV and !!python/name: tags, which a
        # plain safe-loader cannot resolve. It is validated by `mkdocs build`.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        # Only the package and scripts are type checked; the settings come from
        # pyproject.toml so this matches `make type-check` exactly.
        files: ^(heavytails|scripts)/
        additional_dependencies: [types-PyYAML, types-requests]

  - repo: https://github.com/python-poetry/poetry
    rev: 2.2.1
    hooks:
      - id: poetry-check
        args: [--lock]
