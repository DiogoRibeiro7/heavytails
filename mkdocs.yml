    - Basic Concepts: getting-started/concepts.md
  - User Guide:
    - Distributions Overview: guide/distributions.md
    - Working with PDFs and CDFs: guide/pdf-cdf.md
    - Random Sampling: guide/sampling.md
    - Tail Index Estimation: guide/tail-estimation.md
    - Parameter Fitting: guide/fitting.md
    - Tail Diagnostics: guide/diagnostics.md
    - Aggregate Loss and Reinsurance: guide/actuarial.md
    - Streaming Estimation: guide/streaming.md
    - CLI Reference: guide/cli.md
  - Examples:
    - Basic Usage: examples/basic_usage.ipynb
  - Mathematical Background:
    - Heavy-Tail Theory: theory/heavy-tails.md
    - Extreme Value Theory: theory/evt.md
    - Tail Index Estimation Theory: theory/tail-estimation.md
    - Validation Studies: theory/validation.md
  - API Reference:
    - Core Distributions: reference/heavy_tails.md
    - Extra Distributions: reference/extra_distributions.md
    - Discrete Distributions: reference/discrete.md
    - Tail Estimators: reference/tail_index.md
    - Plotting Utilities: reference/plotting.md
    - Diagnostic Plots: reference/viz.md
    - Actuarial: reference/actuarial.md
    - Streaming: reference/streaming.md
    - Vectorized Evaluation: reference/vectorized.md
    - Multivariate: reference/multivariate.md
    - Copulas: reference/copula.md
    - Tail-Risk Metrics: reference/risk.md
    - Threshold Selection: reference/threshold.md
    - Utilities: reference/utilities.md
    - Validation: reference/validation.md
    - Performance: reference/performance.md
    - Extensions: reference/extensions.md
    - Fitting and Roadmap: reference/roadmap.md
    - Command-Line Interface: reference/cli.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
    - Benchmarking: development/benchmarks.md
    - Code Review: development/code-review.md
    - Releasing: development/releasing.md
    - Documentation Overview: DOCUMENTATION_OVERVIEW.md
  - About:
    - Changelog: about/changelog.md
    - License: about/license.md
    - Citation: about/citation.md
    - Authors: about/authors.md

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/diogoribeiro7
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0001-2022-7072
    - icon: fontawesome/solid/envelope
      link: mailto:dfr@esmad.ipp.pt

  version:
    provider: mike
    default: stable

  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/diogoribeiro7/heavytails/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you found unclear</a>.

